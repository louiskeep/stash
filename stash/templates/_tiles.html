{% if q and not results %}
  <p class="empty">No notes match "{{ q }}".</p>
{% elif results %}
  <ol class="notes">
    {% for r in results %}
    <li class="note">
      <a class="raw" href="/note/{{ r.note_id }}">{{ r.raw }}</a>
      <div class="meta">
        <time>{{ r.created_at[:10] }}</time>
        {% for t in r.tags %}<a class="tag" href="/topics/tag/{{ t }}">#{{ t }}</a>{% endfor %}
        <span class="src">{{ r.source }}</span>
      </div>
    </li>
    {% endfor %}
  </ol>
{% endif %}
