<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}stash{% endblock %}</title>
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body hx-headers='{% if csrf_token %}{"x-csrf-token": "{{ csrf_token }}"}{% else %}{}{% endif %}'>
  {% if authed %}
  <header class="bar">
    <a class="wordmark" href="/">stash</a>
    <nav class="nav">
      <a href="/" class="{% if active == 'search' %}on{% endif %}">Search</a>
      <a href="/timeline" class="{% if active == 'timeline' %}on{% endif %}">Timeline</a>
      <a href="/topics" class="{% if active == 'topics' %}on{% endif %}">Topics</a>
      <a href="/reminders" class="{% if active == 'reminders' %}on{% endif %}">Reminders</a>
    </nav>
    <form class="logout" method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Sign out</button>
    </form>
  </header>
  {% endif %}
  <main class="col">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/htmx.min.js" defer></script>
</body>
</html>
