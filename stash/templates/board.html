<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stash board</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <div class="bar">
    <a class="brand" href="/">stash<span class="dot">.</span></a>
    <div class="search">
      <input type="search" id="search" placeholder="Search your notes" aria-label="Search notes" autocomplete="off">
    </div>
    <label class="field">
      <span class="field-label">Topic</span>
      <select id="topic" aria-label="Filter by topic"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Order</span>
      <select id="order" aria-label="Order by time">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">From</span>
      <input type="datetime-local" id="from" aria-label="From date">
    </label>
    <label class="field">
      <span class="field-label">To</span>
      <input type="datetime-local" id="to" aria-label="To date">
    </label>
    <button class="ghost" id="clearBtn" type="button" title="Clear all filters">Clear</button>
    <span class="spacer"></span>
    <form class="logout" method="post" action="/logout" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="ghost" type="submit">Sign out</button>
    </form>
  </div>

  <div class="stage">
    <aside class="rail" id="rail" aria-label="Active reminders">
      <div class="rail-head">Reminders</div>
      <ul class="rail-list" id="railList"></ul>
      <div class="rail-empty" id="railEmpty">No active reminders.</div>
    </aside>
    <div class="board-wrap" id="wrap">
      <div class="grid" id="grid"></div>
      <div class="hint" id="hint" hidden>Nothing matches. Clear a filter, or double-click the board to stash a thought.</div>
      <button class="add" id="addBtn" type="button" aria-label="Add a note">+</button>
    </div>
  </div>

  <script src="/static/muuri.min.js"></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/board-piles.js" defer></script>
</body>
</html>
