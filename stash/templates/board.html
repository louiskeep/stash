<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stash board</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <div class="bar">
    <a class="brand" href="/">stash<span class="dot">.</span></a>
    <div class="search">
      <input type="search" id="search" placeholder="Search your notes" aria-label="Search notes" autocomplete="off">
    </div>
    <label class="field">
      <span class="field-label">Category</span>
      <select id="category" aria-label="Filter by category"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Tag</span>
      <select id="tag" aria-label="Filter by tag"><option value="">All</option></select>
    </label>
    <label class="field">
      <span class="field-label">Order</span>
      <select id="order" aria-label="Order by time">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">From</span>
      <input type="date" id="from" aria-label="From date">
    </label>
    <label class="field">
      <span class="field-label">To</span>
      <input type="date" id="to" aria-label="To date">
    </label>
    <button class="ghost" id="clearBtn" type="button" title="Clear all filters">Clear</button>
    <span class="spacer"></span>
    <div class="reminders-wrap">
      <button class="ghost" id="remindersBtn" type="button" aria-haspopup="true" aria-expanded="false">
        Reminders <span class="count" id="remindersCount" hidden></span>
      </button>
      <div class="reminders-panel" id="remindersPanel" hidden role="menu" aria-label="Active reminders">
        <ul class="rem-list" id="remList"></ul>
        <div class="rem-empty" id="remEmpty">No active reminders.</div>
      </div>
    </div>
    <form class="logout" method="post" action="/logout" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="ghost" type="submit">Sign out</button>
    </form>
  </div>

  <div class="stage">
    <aside class="boards" id="boards" aria-label="Saved boards">
      <div class="boards-head">Boards</div>
      <button class="board-save" id="saveBoardBtn" type="button">+ Save current</button>
      <ul class="boards-list" id="boardsList"></ul>
      <div class="boards-empty" id="boardsEmpty">Set some filters, then save them as a board.</div>
    </aside>
    <div class="board-wrap" id="wrap">
      <div class="grid" id="grid"></div>
      <div class="hint" id="hint" hidden>Nothing matches. Clear a filter, or double-click the board to stash a thought.</div>
      <button class="add" id="addBtn" type="button" aria-label="Add a note">+</button>
    </div>
  </div>

  <script src="/static/muuri.min.js"></script>
  <script src="/static/board.js" defer></script>
  <script src="/static/board-piles.js" defer></script>
</body>
</html>
