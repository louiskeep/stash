{% extends "base.html" %}
{% block title %}Sign in · stash{% endblock %}
{% block content %}
<div class="signin">
  <h1 class="wordmark big">stash</h1>
  <p class="muted">Enter your password to open your notes.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="password" name="password" autofocus autocomplete="current-password"
           aria-label="Password" placeholder="Password">
    <button type="submit">Open</button>
  </form>
</div>
{% endblock %}
