[project]
name = "stash"
version = "0.0.0"
description = "stash - a second brain that isn't a chatbot (recall-only, no generative LLM)"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "starlette>=0.37",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
stash = "stash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the stash package. Hatchling includes every file under a packaged
# directory by default (all are git-tracked; caches are gitignored), so the web
# templates and static assets travel with the module in an installed wheel.
# web.py locates them relative to its own file via os.path.dirname(__file__),
# so they must stay inside the package and no exclude rule may drop them.
packages = ["stash"]
# force-include is additive and does not restrict the default package inclusion,
# so it pins the assets into the wheel without risking the .py files. It keeps
# the runtime-critical templates/static present even if the defaults change.
[tool.hatch.build.targets.wheel.force-include]
"stash/templates" = "stash/templates"
"stash/static" = "stash/static"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
# Import the source tree in place so the suite runs without an install step.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
markers = ["eval: retrieval-quality tests that load the real embedding model"]
